<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06152B" />
    <meta name="description" content="EduMaster.ai · Plataforma educativa multiinstitución" />
    <title>EduMaster.ai · Administración</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Se detecta la invitación ANTES de que Supabase consuma el fragmento Auth.
         Solo se guarda una marca booleana, jamás se persisten tokens. -->
    <script>
      try {
        if (/(?:[?#&])type=invite(?:&|$)/.test(window.location.href))
          sessionStorage.setItem('edumaster:invite-setup', '1');
      } catch (_) { /* Se mantiene la autenticación aunque storage esté bloqueado. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
